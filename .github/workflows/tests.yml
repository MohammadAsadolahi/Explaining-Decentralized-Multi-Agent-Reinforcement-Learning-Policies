name: Python tests
on:
  push:
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q
      - name: Benchmark reference and Figure 1 smoke check
        run: |
          python -m dmarl_explain.benchmark_cli examples/figure1.json --output figure1_audit.json
          python scripts/performance_smoke.py > synthetic_smoke.json
