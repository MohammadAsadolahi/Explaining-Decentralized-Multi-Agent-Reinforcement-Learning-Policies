[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dmarl-explain"
version = "0.1.0"
description = "Trace-based reimplementation of HDS and query explanations from AAAI-26"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Replication contributors"}]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
dmarl-explain = "dmarl_explain.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
